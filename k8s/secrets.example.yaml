apiVersion: v1
kind: Secret
metadata:
  namespace: mongo-verba
  name: secrets
type: Opaque
stringData:
  mongo-db-name: mongo-verba-mongodb
  mongo-admin-username: root
  mongo-admin-password: root
  # Generate it with: cd backend && npm run hash-password
  admin-password-hash: 'scrypt$32768$8$1$<salt>$<hash>'
  # Generate it with: openssl rand -base64 48
  session-secret: '<random string, at least 32 characters>'
